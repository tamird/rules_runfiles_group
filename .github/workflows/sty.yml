name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tamird/sty@d400a00807b3c7f7b2ac82bf1e1e6a16db0290e3
        with:
          audit-loads: true
          bazel-version: '9.3.0'
          advisory-pathspecs: |
            *.bzl
            :(exclude)example/**
          files: |
            runfiles_group/describe.bzl
            runfiles_group/identity_packager.bzl
            runfiles_group/providers.bzl
            runfiles_group/runfiles_group_analysis_test.bzl
            runfiles_group/private/lib/constants.bzl
            runfiles_group/private/lib/content.bzl
            runfiles_group/private/lib/entry.bzl
            runfiles_group/private/providers/runfiles_group_info.bzl
      - name: Check example workspace
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: tamird/sty@d400a00807b3c7f7b2ac82bf1e1e6a16db0290e3
        with:
          artifact-name: sty-example
          advisory-pathspecs: '*.bzl'
          audit-loads: true
          bazel-version: '9.3.0'
          working-directory: example
          files: |
            producer/providers/providers.bzl
            producer/repository_rules/local_starlark_repository.bzl
            producer/rules/foreign_plugin.bzl
            src/group_names.bzl
            stress/gen.bzl
